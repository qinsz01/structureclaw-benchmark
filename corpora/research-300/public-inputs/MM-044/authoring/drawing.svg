<rect x="1700" y="80" width="1648" height="759" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="120" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Properties</text><text x="1728" y="154" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Analysis and property appendix</text><text x="1728" y="186" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">First-order linear elastic static analysis; self-weight OFF. No P-delta, rigid diaphragm, rigid offsets, stiffness</text><text x="1728" y="216" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">reductions, or automatic combinations.</text><text x="1728" y="248" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Global XYZ, Z up. Units: m, kN, kN*m; E/G MPa, density kg/m3, A m2, Iy/Iz/J m4. Displacements m, rotations rad.</text><text x="1728" y="280" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Load components use global XYZ axes: fx/fy/fz are concentrated forces in kN; mx/my/mz are nodal moments in kN*m</text><text x="1728" y="310" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">(right-hand rule); wx/wy/wz are distributed forces in kN/m per actual member length, not projected length. A negative z</text><text x="1728" y="340" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">component acts along global -Z.</text><text x="1728" y="372" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">XZ plane. Inactive uy/rx/rz are restrained. Local 1 runs from the labelled start to end; local 2 is global +Y; local 3 =</text><text x="1728" y="402" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">local 1 cross local 2. Positive Ry/My follows the right-hand rule about global +Y.</text><text x="1728" y="434" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Beam/column joints are rigid and continuous unless a physical support is shown; observation nodes do not create hinges.</text><text x="1728" y="466" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Materials</text><text x="1728" y="498" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M1: E=206000, G=79230.7692, nu=0.3, rho=7850</text><text x="1728" y="530" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Sections (solid rectangular appendix; local y width B and local z depth H)</text><text x="1728" y="562" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">B1: A=0.18, Iy=0.0054, Iz=0.00135, J=0.00370785937</text><text x="1728" y="594" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">B2: A=0.21, Iy=0.008575, Iz=0.001575, J=0.00460378207</text><text x="1728" y="626" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">C1: A=0.25, Iy=0.00520833333, Iz=0.00520833333, J=0.00880208333</text><text x="1728" y="658" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Analyze the explicitly labelled basic case D.</text><text x="1728" y="690" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Report section forces using local axes; support forces/moments use global axes. Preserve signs, selected</text><text x="1728" y="720" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">cases/combinations and section sides.</text><text x="1728" y="752" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#125d80">Analysis settings</text><text x="1728" y="789" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Do not model construction stages.</text><rect x="20" y="831" width="1648" height="668" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="48" y="871" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="48" y="905" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Schematic; use dimensions, do not scale. Filled dots = connected joints. Crossings without dots are not joints.</text><text x="48" y="937" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Length m; force kN; moment kN*m; line load kN/m along actual member length. Global Z up.</text><text x="48" y="969" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-1: wz=-6</text><text x="48" y="1001" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-2: wz=-6</text><text x="48" y="1033" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-3: wz=-6</text><text x="48" y="1065" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-4: wz=-6</text><text x="48" y="1097" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Member key: ID : start -&gt; end / material / section</text><text x="48" y="1129" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column0: B0 -&gt; E0 / M1 / C1</text><text x="48" y="1161" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column1: B1 -&gt; E1 / M1 / C1</text><text x="48" y="1193" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column2: B2 -&gt; E2 / M1 / C1</text><text x="48" y="1225" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">flat_left: E0 -&gt; M / M1 / B1</text><text x="48" y="1257" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">flat_right: M -&gt; E1 / M1 / B1</text><text x="48" y="1289" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">slope_left: E1 -&gt; R / M1 / B2</text><text x="48" y="1321" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">slope_right: R -&gt; E2 / M1 / B2</text><text x="48" y="1353" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">The flat roof and pitched roof share rigid joint E1 at the middle column.</text><text x="48" y="1385" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M is a connected midpoint observation node, with no support or hinge.</text><text x="48" y="1417" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Flat roof: B1. Pitched roof: B2. Columns: C1. All bases fixed.</text><text x="48" y="1449" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">All roof loads act along global -Z: 6 kN/m per actual member length.</text></svg>
