"22" fill="#172b3a">LC0: L0 -&gt; L1 / M1 / A1</text><text x="1728" y="538" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">LC1: L1 -&gt; L2 / M1 / A1</text><text x="1728" y="570" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">LC2: L2 -&gt; L3 / M1 / A1</text><text x="1728" y="602" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">LC3: L3 -&gt; L4 / M1 / A1</text><text x="1728" y="634" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">LC4: L4 -&gt; L5 / M1 / A1</text><text x="1728" y="666" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">UC0: L0 -&gt; U1 / M1 / A1</text><text x="1728" y="698" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">UC1: U1 -&gt; U2 / M1 / A1</text><text x="1728" y="730" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">UC2: U2 -&gt; U3 / M1 / A1</text><text x="1728" y="762" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">UC3: U3 -&gt; U4 / M1 / A1</text><text x="1728" y="794" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">UC4: U4 -&gt; L5 / M1 / A1</text><text x="1728" y="826" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D1: L1 -&gt; U2 / M1 / A1</text><text x="1728" y="858" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D2: L2 -&gt; U3 / M1 / A1</text><text x="1728" y="890" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D3: L3 -&gt; U4 / M1 / A1</text><text x="1728" y="922" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">All rods use M1/A1. Solid dots identify joints.</text><text x="1728" y="954" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Roof chords are straight between labelled joints.</text><text x="1728" y="986" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Ridge U2: H = 2.5 m above the bottom chord.</text><text x="1728" y="1018" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">U1: Z = 1.25 m; U2: Z = 2.5 m; U3: Z = 5/3 m; U4: Z = 5/6 m.</text><rect x="20" y="894" width="1648" height="124" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="48" y="934" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Released supplement</text><text x="48" y="968" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">The supplement provides ridge height 2.5 m and all roof elevations. Complete the requested analysis.</text></svg>
