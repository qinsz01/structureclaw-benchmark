<rect x="1700" y="80" width="1648" height="575" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="120" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Properties</text><text x="1728" y="154" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">分析与属性附录</text><text x="1728" y="186" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">一阶线弹性静力；自重关闭。不开启 P-delta、刚性楼板、刚域、刚度折减或默认组合。</text><text x="1728" y="218" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">全局 XYZ，Z 向上。单位：m、kN、kN*m；E/G 为 MPa，密度 kg/m3，A 为 m2，Iy/Iz/J 为 m4；位移 m，转角 rad。</text><text x="1728" y="250" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">荷载分量按全局 XYZ 轴：fx/fy/fz 为集中力，单位 kN；mx/my/mz 为节点力矩，单位 kN*m（右手定则）；wx/wy/wz 为线分布力，单位</text><text x="1728" y="280" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">kN/m，按杆件实际长度计，不按投影长度计。z 分量为负表示沿全局 -Z。</text><text x="1728" y="312" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">XZ 平面，非作用自由度 uy/rx/rz 约束。局部 1 轴由图示起点指向终点，局部 2 为全局 +Y，局部 3=局部1叉乘局部2。Ry/My 按全局 +Y 右手定则。</text><text x="1728" y="344" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">梁柱节点刚接连续，观测节点不产生内铰，支座按图。</text><text x="1728" y="376" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">材料</text><text x="1728" y="408" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M1: E=206000, G=79230.7692, nu=0.3, rho=7850</text><text x="1728" y="440" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">截面（附录采用实心矩形；局部 y 宽 B、局部 z 高 H）</text><text x="1728" y="472" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">B1: A=0.18, Iy=0.0054, Iz=0.00135, J=0.00370785937</text><text x="1728" y="504" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">分析图示基本工况 D。</text><text x="1728" y="536" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">截面力使用局部轴，支座力及力矩使用全局轴。保留正负号、工况/组合及截面左右侧。</text><text x="1728" y="568" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#125d80">Analysis settings</text><text x="1728" y="605" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">不考虑施工阶段。</text><rect x="20" y="452" width="1648" height="412" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="48" y="492" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="48" y="526" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">示意图，以标注尺寸为准，禁止量图。实心点为连接节点，无点交叉不连接。</text><text x="48" y="558" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">长度 m；力 kN；力矩 kN*m；线载 kN/m 按杆件实际长度。全局 Z 向上。</text><text x="48" y="590" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-1: wz=-6</text><text x="48" y="622" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-2: wz=-6</text><text x="48" y="654" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-3: my=20</text><text x="48" y="686" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">构件索引：ID : 起点 -&gt; 终点 / 材料 / 截面</text><text x="48" y="718" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">b1: n0 -&gt; n1 / M1 / B1</text><text x="48" y="750" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">b2: n1 -&gt; n2 / M1 / B1</text><text x="48" y="782" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">中支点为竖向滚支，转角自由且无内铰。</text><text x="48" y="814" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">中支点外加力矩绕全局+Y轴，按右手定则取正。</text></svg>
