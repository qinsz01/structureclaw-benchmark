<rect x="1700" y="824" width="1648" height="727" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="864" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Properties</text><text x="1728" y="898" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Analysis and property appendix</text><text x="1728" y="930" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">First-order linear elastic static analysis; self-weight OFF. No P-delta, rigid diaphragm, rigid offsets, stiffness</text><text x="1728" y="960" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">reductions, or automatic combinations.</text><text x="1728" y="992" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Global XYZ, Z up. Units: m, kN, kN*m; E/G MPa, density kg/m3, A m2, Iy/Iz/J m4. Displacements m, rotations rad.</text><text x="1728" y="1024" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Load components use global XYZ axes: fx/fy/fz are concentrated forces in kN; mx/my/mz are nodal moments in kN*m</text><text x="1728" y="1054" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">(right-hand rule); wx/wy/wz are distributed forces in kN/m per actual member length, not projected length. A negative z</text><text x="1728" y="1084" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">component acts along global -Z.</text><text x="1728" y="1116" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">XZ plane. Inactive uy/rx/rz are restrained. Local 1 runs from the labelled start to end; local 2 is global +Y; local 3 =</text><text x="1728" y="1146" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">local 1 cross local 2. Positive Ry/My follows the right-hand rule about global +Y.</text><text x="1728" y="1178" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Beam/column joints are rigid and continuous unless a physical support is shown; observation nodes do not create hinges.</text><text x="1728" y="1210" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Materials</text><text x="1728" y="1242" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M1: E=206000, G=79230.7692, nu=0.3, rho=7850</text><text x="1728" y="1274" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Sections (solid rectangular appendix; local y width B and local z depth H)</text><text x="1728" y="1306" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">B1: A=0.18, Iy=0.0054, Iz=0.00135, J=0.00370785937</text><text x="1728" y="1338" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">C1: A=0.25, Iy=0.00520833333, Iz=0.00520833333, J=0.00880208333</text><text x="1728" y="1370" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Analyze the explicitly labelled basic case D.</text><text x="1728" y="1402" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Report section forces using local axes; support forces/moments use global axes. Preserve signs, selected</text><text x="1728" y="1432" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">cases/combinations and section sides.</text><text x="1728" y="1464" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#125d80">Analysis settings</text><text x="1728" y="1501" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Do not model construction stages.</text><rect x="20" y="868" width="1648" height="604" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="48" y="908" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="48" y="942" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Schematic; use dimensions, do not scale. Filled dots = connected joints. Crossings without dots are not joints.</text><text x="48" y="974" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Length m; force kN; moment kN*m; line load kN/m along actual member length. Global Z up.</text><text x="48" y="1006" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-1: wz=-6</text><text x="48" y="1038" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-2: wz=-6</text><text x="48" y="1070" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-3: fx=4.9, fz=-49</text><text x="48" y="1102" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Member key: ID : start -&gt; end / material / section</text><text x="48" y="1134" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column0: B0 -&gt; E0 / M1 / C1</text><text x="48" y="1166" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column2: B2 -&gt; E2 / M1 / C1</text><text x="48" y="1198" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column1_lower: B1 -&gt; P / M1 / C1</text><text x="48" y="1230" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column1_upper: P -&gt; E1 / M1 / C1</text><text x="48" y="1262" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">roof0: E0 -&gt; E1 / M1 / B1</text><text x="48" y="1294" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">roof1: E1 -&gt; E2 / M1 / B1</text><text x="48" y="1326" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">The middle base B1, load node P and roof joint E1 are distinct connected nodes.</text><text x="48" y="1358" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">All three actual column bases are fixed. Do not extend the middle column below B1.</text><text x="48" y="1390" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">P: Fx=+4.9 kN and Fz=-49 kN. Both roof spans: global -Z 6 kN/m.</text><text x="48" y="1422" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Local joint detail; member IDs and dimensions refer to the overview. This is a crop, not a separate structure.</text></svg>
