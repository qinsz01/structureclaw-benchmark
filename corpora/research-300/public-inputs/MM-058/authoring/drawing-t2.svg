<rect x="1700" y="80" width="1648" height="316" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="120" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="1728" y="154" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Orthographic input. Member intersections connect only at labelled nodes. All shown joints rigid except truss ends.</text><text x="1728" y="186" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Blue dots = physical joints / connected observation nodes; green members = axial-only braces.</text><text x="1728" y="218" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Thin member arrows define local first-to-second direction. Orange arrows indicate load direction in this projection.</text><text x="1728" y="250" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">LOAD KEY: rows add within each case; kN, kN*m, kN/m of actual length; vector components use named axes.</text><text x="1728" y="282" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D | R | wz=-8</text><text x="1728" y="314" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D | RE | wz=-8</text><text x="1728" y="346" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D | E | fx=50</text><rect x="1700" y="412" width="1648" height="154" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="452" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Released supplement</text><text x="1728" y="486" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">The completed drawing confirms that both column bases are fixed. Use the newly supplied drawing to analyze case D and</text><text x="1728" y="516" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">report the requested displacements and right-base moment.</text></svg>
