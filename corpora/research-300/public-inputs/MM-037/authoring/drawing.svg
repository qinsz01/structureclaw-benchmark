<rect x="1700" y="80" width="1648" height="1215" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="120" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Properties</text><text x="1728" y="154" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">分析与属性附录</text><text x="1728" y="186" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">一阶线弹性静力；自重关闭。不开启 P-delta、刚性楼板、刚域、刚度折减或默认组合。</text><text x="1728" y="218" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">全局 XYZ，Z 向上。单位：m、kN、kN*m；E/G 为 MPa，密度 kg/m3，A 为 m2，Iy/Iz/J 为 m4；位移 m，转角 rad。</text><text x="1728" y="250" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">荷载分量按全局 XYZ 轴：fx/fy/fz 为集中力，单位 kN；mx/my/mz 为节点力矩，单位 kN*m（右手定则）；wx/wy/wz 为线分布力，单位</text><text x="1728" y="280" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">kN/m，按杆件实际长度计，不按投影长度计。z 分量为负表示沿全局 -Z。</text><text x="1728" y="312" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">XZ 平面，非作用自由度 uy/rx/rz 约束。局部 1 轴由图示起点指向终点，局部 2 为全局 +Y，局部 3=局部1叉乘局部2。Ry/My 按全局 +Y 右手定则。</text><text x="1728" y="344" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">全部为铰接纯轴力杆，转动非作用，不添加弯曲刚度。</text><text x="1728" y="376" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">材料</text><text x="1728" y="408" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M1: E=206000, G=79230.7692, nu=0.3, rho=7850</text><text x="1728" y="440" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">截面（附录采用实心矩形；局部 y 宽 B、局部 z 高 H）</text><text x="1728" y="472" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">A1: A=0.01, Iy=8.33333333e-06, Iz=8.33333333e-06, J=1.40833333e-05</text><text 