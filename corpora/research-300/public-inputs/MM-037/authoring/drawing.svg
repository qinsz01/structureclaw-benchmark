ize="22" fill="#172b3a">UC2: M1 / A1</text><text x="1728" y="1016" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">荷载表；位置/区域以图内标签为准</text><text x="1728" y="1048" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-U0: U0: fz=-8</text><text x="1728" y="1080" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-U1: U1: fz=-12</text><text x="1728" y="1112" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-U2: U2: fz=-10</text><text x="1728" y="1144" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-U3: U3: fz=-6</text><text x="1728" y="1176" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">分析图示基本工况 D。</text><text x="1728" y="1208" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">截面力使用局部轴，支座力及力矩使用全局轴。保留正负号、工况/组合及截面左右侧。</text><text x="1728" y="1240" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#125d80">Analysis settings</text><rect x="20" y="894" width="1648" height="732" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="48" y="934" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="48" y="968" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">示意图，以标注尺寸为准，禁止量图。实心点为连接节点，无点交叉不连接。</text><text x="48" y="1000" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">长度 m；力 kN；力矩 kN*m；线载 kN/m 按杆件实际长度。全局 Z 向上。</text><text x="48" y="1032" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">构件索引：ID : 起点 -&gt; 终点 / 材料 / 截面</text><text x="48" y="1064" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">DL0: L0 -&gt; U0 / M1 / A1</text><text x="48" y="1096" font-family="DejaVu Sans, Noto