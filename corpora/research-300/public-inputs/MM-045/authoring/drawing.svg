<rect x="1700" y="824" width="1648" height="607" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="864" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Properties</text><text x="1728" y="898" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">分析与属性附录</text><text x="1728" y="930" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">一阶线弹性静力；自重关闭。不开启 P-delta、刚性楼板、刚域、刚度折减或默认组合。</text><text x="1728" y="962" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">全局 XYZ，Z 向上。单位：m、kN、kN*m；E/G 为 MPa，密度 kg/m3，A 为 m2，Iy/Iz/J 为 m4；位移 m，转角 rad。</text><text x="1728" y="994" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">荷载分量按全局 XYZ 轴：fx/fy/fz 为集中力，单位 kN；mx/my/mz 为节点力矩，单位 kN*m（右手定则）；wx/wy/wz 为线分布力，单位</text><text x="1728" y="1024" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">kN/m，按杆件实际长度计，不按投影长度计。z 分量为负表示沿全局 -Z。</text><text x="1728" y="1056" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">XZ 平面，非作用自由度 uy/rx/rz 约束。局部 1 轴由图示起点指向终点，局部 2 为全局 +Y，局部 3=局部1叉乘局部2。Ry/My 按全局 +Y 右手定则。</text><text x="1728" y="1088" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">梁柱节点刚接连续，观测节点不产生内铰，支座按图。</text><text x="1728" y="1120" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">材料</text><text x="1728" y="1152" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M1: E=206000, G=79230.7692, nu=0.3, rho=7850</text><text x="1728" y="1184" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">截面（附录采用实心矩形；局部 y 宽 B、局部 z 高 H）</text><text x="1728" y="1216" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">B1: A=0.18, Iy=0.0054, Iz=0.00135, J=0.00370785937</text><text x="1728" y="1248" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">C1: A=0.25, Iy=0.00520833333, Iz=0.00520833333, J=0.00880208333</text><text x="1728" y="1280" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">分析图示基本工况 D。</text><text x="1728" y="1312" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">截面力使用局部轴，支座力及力矩使用全局轴。保留正负号、工况/组合及截面左右侧。</text><text x="1728" y="1344" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#125d80">Analysis settings</text><text x="1728" y="1381" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">不考虑施工阶段。</text><rect x="20" y="848" width="1648" height="508" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="48" y="888" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="48" y="922" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">示意图，以标注尺寸为准，禁止量图。实心点为连接节点，无点交叉不连接。</text><text x="48" y="954" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">长度 m；力 kN；力矩 kN*m；线载 kN/m 按杆件实际长度。全局 Z 向上。</text><text x="48" y="986" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-1: wz=-8</text><text x="48" y="1018" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-2: wz=-8</text><text x="48" y="1050" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">构件索引：ID : 起点 -&gt; 终点 / 材料 / 截面</text><text x="48" y="1082" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column_left: BL -&gt; EL / M1 / C1</text><text x="48" y="1114" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column_right: BR -&gt; ER / M1 / C1</text><text x="48" y="1146" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">roof_left: EL -&gt; M / M1 / B1</text><text x="48" y="1178" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">roof_right: M -&gt; ER / M1 / B1</text><text x="48" y="1210" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">左柱脚铰接，右柱脚固接；两檐口及梁中点均连续刚接。</text><text x="48" y="1242" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M为斜屋面几何中点，是连通观测节点，无支座或释放。</text><text x="48" y="1274" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">坡梁线载沿全局-Z，按实际坡长计8 kN/m，不是杆件法向载荷。</text><text x="48" y="1306" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">节点局部详图：构件 ID 与尺寸对应总图。此为局部，不是独立结构。</text></svg>
