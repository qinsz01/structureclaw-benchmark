<rect x="1700" y="855" width="1648" height="540" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="895" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Drawing legend</text><text x="1728" y="929" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Schematic; use dimensions, do not scale. Filled dots = connected joints. Crossings without dots are not joints.</text><text x="1728" y="961" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Length m; force kN; moment kN*m; line load kN/m along actual member length. Global Z up.</text><text x="1728" y="993" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-1: wz=-6</text><text x="1728" y="1025" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">D/D-2: wz=-6</text><text x="1728" y="1057" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Member key: ID : start -&gt; end / material / section</text><text x="1728" y="1089" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column0: B0 -&gt; E0 / M1 / C1</text><text x="1728" y="1121" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column1: B1 -&gt; E1 / M1 / C2</text><text x="1728" y="1153" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">column2: B2 -&gt; E2 / M1 / C1</text><text x="1728" y="1185" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">roof0: E0 -&gt; E1 / M1 / B1</text><text x="1728" y="1217" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">roof1: E1 -&gt; E2 / M1 / B1</text><text x="1728" y="1249" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">E1 is the shared rigid joint of the middle column and both roof slopes.</text><text x="1728" y="1281" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Outer columns: C1; middle column: C2; roof slopes: B1. All bases fixed.</text><text x="1728" y="1313" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Both slopes carry global -Z 6 kN/m, measured per actual slope length.</text><text x="1728" y="1345" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Local joint detail; member IDs and dimensions refer to the overview. This is a crop, not a separate structure.</text></svg>
