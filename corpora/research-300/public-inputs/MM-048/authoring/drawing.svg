<rect x="1700" y="80" width="1648" height="759" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="1728" y="120" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="25" fill="#125d80">Properties</text><text x="1728" y="154" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Analysis and property appendix</text><text x="1728" y="186" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">First-order linear elastic static analysis; self-weight OFF. No P-delta, rigid diaphragm, rigid offsets, stiffness</text><text x="1728" y="216" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">reductions, or automatic combinations.</text><text x="1728" y="248" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Global XYZ, Z up. Units: m, kN, kN*m; E/G MPa, density kg/m3, A m2, Iy/Iz/J m4. Displacements m, rotations rad.</text><text x="1728" y="280" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Load components use global XYZ axes: fx/fy/fz are concentrated forces in kN; mx/my/mz are nodal moments in kN*m</text><text x="1728" y="310" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">(right-hand rule); wx/wy/wz are distributed forces in kN/m per actual member length, not projected length. A negative z</text><text x="1728" y="340" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">component acts along global -Z.</text><text x="1728" y="372" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">XZ plane. Inactive uy/rx/rz are restrained. Local 1 runs from the labelled start to end; local 2 is global +Y; local 3 =</text><text x="1728" y="402" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">local 1 cross local 2. Positive Ry/My follows the right-hand rule about global +Y.</text><text x="1728" y="434" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Beam/column joints are rigid and continuous unless a physical support is shown; observation nodes do not create hinges.</text><text x="1728" y="466" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Materials</text><text x="1728" y="498" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">M1: E=206000, G=79230.7692, nu=0.3, rho=7850</text><text x="1728" y="530" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Sections (solid rectangular appendix; local y width B and local z depth H)</text><text x="1728" y="562" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">B1: A=0.18, Iy=0.0054, Iz=0.00135, J=0.00370785937</text><text x="1728" y="594" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">C1: A=0.25, Iy=0.00520833333, Iz=0.00520833333, J=0.00880208333</text><text x="1728" y="626" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">C2: A=0.175, Iy=0.00364583333, Iz=0.00178645833, J=0.00405757334</text><text x="1728" y="658" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Analyze the explicitly labelled basic case D.</text><text x="1728" y="690" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Report section forces using local axes; support forces/moments use global axes. Preserve signs, selected</text><text x="1728" y="720" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">cases/combinations and section sides.</text><text x="1728" y="752" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#125d80">Analysis settings</text><text x="1728" y="789" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Do not model construction stages.</text><rect x="20" y="824" width="1398" height="728" fill="white" stroke="#b5c7d2" stroke-width="1" /><text x="44.4" y="858.6" font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif" font-size="26" fill="#172b3a">MM-048 | ENGINEERING INPUT | XZ view</text><polyline points="689.942,1382.744 689.942,966.244" fill="none" stroke="#24394b" stroke-width="5" />
