<text x="1090.000" y="1124.000" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#172b3a">YZ 为真实侧投影：各节点均在 Y=0，构件投影可重合。</text>
<text x="1090.000" y="1164.000" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#172b3a">完整 X 坐标与折线连接关系请联合读取 XZ / XY 图。</text>
<text x="45.000" y="1390.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">构件索引：ID : 起点 -&gt; 终点 / 截面；全部材料 M1。各投影中的同名节点表示同一节点。</text>
<text x="55.000" y="1445.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#15648c">column_left: BL -&gt; EL / C1</text>
<text x="1345.000" y="1445.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#15648c">column_right: BR -&gt; ER / C1</text>
<text x="55.000" y="1491.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#15648c">roof1: EL -&gt; PL / B1</text>
<text x="1345.000" y="1491.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#15648c">roof2: PL -&gt; V / B1</text>
<text x="55.000" y="1537.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#15648c">roof3: V -&gt; PR / B1</text>
<text x="1345.000" y="1537.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#15648c">roof4: PR -&gt; ER / B1</text>
<text x="45.000" y="1625.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">屋面从左到右 roof1/roof2 向下 5 kN/m；roof3/roof4 向下 7 kN/m，均按实际杆长。</text>
<text x="45.000" y="1673.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">仅 BL/BR 全固定；所有其他节点均为刚接自由节点。XZ 平面外 uy/rx/rz 为非作用自由度。</text>
<text x="45.000" y="1721.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">PL、V、PR 三个屋面折点下方均无柱；不得将重叠投影误认为连接或附加空间杆件。</text>
