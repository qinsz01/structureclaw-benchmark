<text x="45.000" y="113.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">示意图：以标注尺寸为准，禁止量图。实心点为节点，无点交叉不连接。</text>
<text x="45.000" y="155.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">长度 m；力 kN；线载 kN/m 按实际杆长。全局 Z 向上。</text>
<text x="45.000" y="210.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">本题为 XZ 平面刚架，全部 Y=0。投影重合的节点仍保留各自 ID；各折点均刚接，折点下方无柱。</text>
<text x="45.000" y="253.000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#172b3a">绿色为 BL/BR 固支；红色荷载由独立引线及构件 ID 指明，全部组成工况 D。未列荷载分量为零。</text>
