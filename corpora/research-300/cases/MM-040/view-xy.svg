<text x="55.000" y="1236.000" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">All four base joints restrain global ux, uy and uz; apex translations are free.</text>
<text x="55.000" y="1267.000" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">There are four base-edge rods and four inclined rods; no base diagonals.</text>
<text x="55.000" y="1298.000" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#172b3a">Plan uses X-Y; front elevation uses X-Z; side elevation uses Y-Z.</text>
